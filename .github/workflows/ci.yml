name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md', '.artifacts/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', '.artifacts/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          key: checks
      - name: Cargo check and tests
        working-directory: crates
        run: |
          cargo check --locked
          cargo test --locked
      - name: Check scripts
        run: |
          shellcheck scripts/*.sh
          python3 -m py_compile scripts/*.py

  device:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build device binaries
        run: bash scripts/build-rust.sh
      - name: Package binaries and source
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/package-release.py
      - name: Validate package
        run: python3 scripts/prepublish_check.py --deb dist/cardshot_*_arm64.deb --app-dir .
      - uses: actions/upload-artifact@v4
        with:
          name: cardshot-device
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/cardshot_*_arm64.deb
            dist/cardshot-*-source.tar.gz
            dist/SHA256SUMS

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, device]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cardshot-device
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes \
            cardshot_*_arm64.deb cardshot-*-source.tar.gz SHA256SUMS

  store:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/publish-store.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      CARDPUTER_STORE_TOKEN: ${{ secrets.CARDPUTER_STORE_TOKEN }}
