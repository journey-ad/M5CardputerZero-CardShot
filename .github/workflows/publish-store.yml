name: Publish to CardputerZero Store

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CARDPUTER_STORE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 已构建的 Release tag，例如 v0.1.0
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: cardshot-store
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check store credentials
        env:
          GH_TOKEN: ${{ secrets.CARDPUTER_STORE_TOKEN }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::请在仓库 Actions secrets 中配置 CARDPUTER_STORE_TOKEN"
            exit 1
          fi
          owner=$(gh api user --jq .login)
          if [[ "$owner" != "$EXPECTED_OWNER" ]]; then
            echo "::error::CARDPUTER_STORE_TOKEN 必须属于 $EXPECTED_OWNER，当前账号为 $owner"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CardputerZero/AppBuilder
          ref: 18996b694ae305306fc5d457d982cfba0b0e7cc5
          path: .publish-tools/appbuilder
          persist-credentials: false
      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y dpkg
      - name: Download and validate release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern "cardshot_${RELEASE_TAG#v}_arm64.deb" --pattern SHA256SUMS
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS)
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          manifest = json.loads(Path("app-builder.json").read_text())
          version = manifest["version"]
          deb = f"dist/cardshot_{version}_arm64.deb"
          deb_version = subprocess.check_output(["dpkg-deb", "-f", deb, "Version"], text=True).strip()
          if tag != f"v{version}" or deb_version != version:
              raise SystemExit("Release tag、安装包和 app-builder.json 的版本必须一致")
          release = json.loads(subprocess.check_output(["gh", "release", "view", tag, "--json", "assets"], text=True))
          names = {asset["name"] for asset in release["assets"]}
          if f"cardshot-{version}-source.tar.gz" not in names:
              raise SystemExit("Release 缺少对应版本的源码包")
          PY
          python3 scripts/prepublish_check.py --deb "dist/cardshot_${RELEASE_TAG#v}_arm64.deb" --app-dir .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
      - name: Submit store update
        env:
          GH_TOKEN: ${{ secrets.CARDPUTER_STORE_TOKEN }}
          GIT_AUTHOR_NAME: ${{ github.repository_owner }}
          GIT_AUTHOR_EMAIL: ${{ github.repository_owner }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.repository_owner }}
          GIT_COMMITTER_EMAIL: ${{ github.repository_owner }}@users.noreply.github.com
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: 'git@github.com:'
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: ''
          GIT_CONFIG_KEY_2: credential.https://github.com.helper
          GIT_CONFIG_VALUE_2: '!gh auth git-credential'
        run: |
          trap 'rm -f "$HOME/.czdev/credentials"' EXIT
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          credentials = Path.home() / ".czdev" / "credentials"
          credentials.parent.mkdir(parents=True, exist_ok=True)
          credentials.write_text(json.dumps({"github_token": os.environ["GH_TOKEN"]}))
          credentials.chmod(0o600)
          PY
          .publish-tools/appbuilder/czdev publish \
            --deb "dist/cardshot_${RELEASE_TAG#v}_arm64.deb" | tee "$RUNNER_TEMP/store-publish.log"
          pr_url=$(sed -n 's/^ *\(https:\/\/github.com\/CardputerZero\/packages\/pull\/[0-9]*\) *$/\1/p' "$RUNNER_TEMP/store-publish.log")
          if [[ -n "$pr_url" ]]; then
            echo "商店更新 PR：$pr_url" >> "$GITHUB_STEP_SUMMARY"
          fi
