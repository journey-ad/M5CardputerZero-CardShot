[package]
name = "cardshot-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
slint = { version = "~1.8", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }
i-slint-core = { version = "=1.8.0", default-features = false, features = ["std"] }
memmap2 = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
slint-build = "~1.8"
fontdue = "0.9"
